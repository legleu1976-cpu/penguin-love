<script>
/* ================== EDIT THESE ================== */
const SECRET = "love";
let photoSpeed = 9000; // ms (slower = bigger). example: 12000
/* =============================================== */

// Helpers
const el = (id)=>document.getElementById(id);

// Elements
const lock = el("lock");
const pw = el("pw");
const status = el("status");
const enterBtn = el("enterBtn");

const music = el("music");
const voice = el("voice");
const musicBtn = el("musicBtn");

const penguinImg = el("penguinImg");
const fill = el("fill");

const gallery = el("gallery");
const photoMessage = el("photoMessage");
const prevBtn = el("prevBtn");
const nextBtn = el("nextBtn");

const voiceBtn = el("voiceBtn");
const noteBtn = el("noteBtn");
const themesBtn = el("themesBtn");

const sheetOverlay = el("sheetOverlay");
const themeSheet = el("themeSheet");
const closeSheetBtn = el("closeSheetBtn");

// ===== THEMES (colors + floaties) =====
const THEMES = [
  {
    name:"🐧 Penguin",
    bg1:"#b3e5fc", bg2:"#e1f5fe",
    accent:"#1565c0", text:"#0b1b2b",
    font:'"Trebuchet MS", Arial, sans-serif',
    msgBg:"rgba(21,101,192,0.45)",
    floats:["🐧","❄️","✨","❄️","✨"] // a little extra sparkle
  },
  {
    name:"❤️ Heart",
    bg1:"#ffd6e8", bg2:"#fff0f7",
    accent:"#ff4081", text:"#2a0b14",
    font:'"Comic Sans MS", cursive',
    msgBg:"rgba(255,64,129,0.45)",
    floats:["❤️","💖","✨","💖","❤️"]
  },
  {
    name:"🍷 Wine",
    bg1:"#2b0b17", bg2:"#4b1230",
    accent:"#c2185b", text:"#fff5f8",
    font:'Georgia, "Times New Roman", serif',
    msgBg:"rgba(194,24,91,0.45)",
    // more wine glasses + cheers
    floats:["🍷","🍷","🍷","🥂","✨","🍷","🥂"]
  }
];

let themeIndex = 1; // default: 0 penguin, 1 heart, 2 wine

function applyTheme(idx){
  const t = THEMES[idx];
  document.documentElement.style.setProperty("--bg1", t.bg1);
  document.documentElement.style.setProperty("--bg2", t.bg2);
  document.documentElement.style.setProperty("--accent", t.accent);
  document.documentElement.style.setProperty("--text", t.text);
  document.documentElement.style.setProperty("--font", t.font);
  document.documentElement.style.setProperty("--msgBg", t.msgBg);
  themeIndex = idx;
}
applyTheme(themeIndex);

// ===== PHOTO LIST (9) =====
const photos = [
  {src:"photo1.jpg", msg:"Our first memory together 💖"},
  {src:"photo2.jpg", msg:"Adventure on our first trip ✈️"},
  {src:"photo3.jpg", msg:"Laughing together 🐧"},
  {src:"photo4.jpg", msg:"A cozy night 💕"},
  {src:"photo5.jpg", msg:"Our favorite moment ❤️"},
  {src:"photo6.jpg", msg:"Forever love ✨"},
  {src:"photo7.jpg", msg:"Special memories together 💌"},
  {src:"photo8.jpg", msg:"Another beautiful memory 💕"},
  {src:"photo9.jpg", msg:"One of my favorite moments with you ❤️"}
];

let photoIndex = 0;
let autoRotate = null;

// Crossfade show
function showPhoto(index){
  gallery.style.opacity = 0;
  photoMessage.style.opacity = 0;

  setTimeout(()=>{
    gallery.src = photos[index].src;
    photoMessage.textContent = photos[index].msg;
    gallery.style.opacity = 1;
    photoMessage.style.opacity = 1;
    photoIndex = index;
  }, 650);
}

function nextPhoto(){ showPhoto((photoIndex + 1) % photos.length); }
function prevPhoto(){ showPhoto((photoIndex - 1 + photos.length) % photos.length); }

function startAutoRotate(){
  if(autoRotate) clearInterval(autoRotate);
  autoRotate = setInterval(nextPhoto, photoSpeed);
}

function setPhotoSpeed(ms){
  photoSpeed = ms;
  startAutoRotate();
}

// ===== FLOATIES (theme-based + drift + spin) =====
let floatTimer = null;

function spawnFloat(xPercent=null, burst=false){
  const t = THEMES[themeIndex];

  const f = document.createElement("div");
  f.className = "float";
  f.innerHTML = t.floats[Math.floor(Math.random() * t.floats.length)];

  // position
  const left = (xPercent === null) ? (Math.random() * 100) : xPercent;
  f.style.left = left + "vw";

  // size variety
  const size = burst ? (20 + Math.random()*26) : (16 + Math.random()*22);
  f.style.fontSize = size + "px";

  // drift + spin parameters (CSS keyframes are vertical; we add extra transform via animation)
  const drift = (Math.random()*80 - 40); // -40..40 px sideways drift
  const spin = (Math.random()*240 - 120); // -120..120 deg
  const dur = burst ? (3.5 + Math.random()*1.5) : (5.0 + Math.random()*2.0);

  f.animate(
    [
      { transform: `translate(${0}px, 110vh) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${drift}px, -20vh) rotate(${spin}deg)`, opacity: 0 }
    ],
    { duration: dur*1000, easing: "linear", fill: "forwards" }
  );

  document.body.appendChild(f);
  setTimeout(()=>f.remove(), dur*1000 + 100);
}

function startFloaties(){
  if(floatTimer) return;
  floatTimer = setInterval(()=>spawnFloat(), 550);
}

// Burst when tapping penguin
function burstAtPenguin(){
  // spawn a cluster near center (around penguin)
  const base = 50 + (Math.random()*6 - 3); // around middle
  for(let k=0; k<14; k++){
    // small spread left/right
    const x = base + (Math.random()*14 - 7);
    setTimeout(()=>spawnFloat(x, true), k*35);
  }
}

// ===== COUNTDOWN =====
function updateCountdown(){
  const d = new Date("2024-09-17");
  const now = new Date();
  const diff = Math.abs(now - d);
  el("countdown").textContent = Math.floor(diff/86400000) + " days together 💕";
}
setInterval(updateCountdown, 60000);
updateCountdown();

// ===== MUSIC TOGGLE =====
function toggleMusic(){
  if(music.paused){
    music.play().catch(()=>{});
    musicBtn.textContent = "Pause Music";
  } else {
    music.pause();
    musicBtn.textContent = "Play Music";
  }
}

// ===== VOICE (pause music automatically) =====
function playVoice(){
  if(!music.paused){
    music.pause();
    musicBtn.textContent = "Play Music";
  }
  voice.currentTime = 0;
  voice.play().catch(()=>{});
}

// ===== LOVE NOTES =====
function loveNote(){
  const notes = [
    "You are my favorite person ❤️",
    "I’d choose you in every lifetime 💫",
    "My heart is yours forever 🐧💖",
    "You are my home 🏡",
    "I love you more than yesterday… and less than tomorrow 💞"
  ];
  alert(notes[Math.floor(Math.random()*notes.length)]);
}

// ===== HEART METER + PENGUIN TAP =====
let hearts = 0;
function penguinTap(){
  // burst effect
  burstAtPenguin();

  // meter
  hearts++;
  fill.style.width = Math.min(hearts*10, 100) + "%";
  if(hearts === 10) alert("💖 Secret Message: You are my forever 💖");
}

// ===== THEME SHEET =====
function openThemeSheet(){
  sheetOverlay.style.display = "block";
  themeSheet.classList.add("open");
  themeSheet.setAttribute("aria-hidden","false");
}
function closeThemeSheet(){
  themeSheet.classList.remove("open");
  themeSheet.setAttribute("aria-hidden","true");
  setTimeout(()=>{ sheetOverlay.style.display = "none"; }, 200);
}

// ===== UNLOCK (never silent) =====
function unlock(){
  const typed = (pw.value || "").trim();
  if(!typed){
    status.textContent = "Type the password first 🙂";
    return;
  }
  if(typed !== SECRET){
    status.textContent = "Wrong password. Try again 💖";
    return;
  }

  status.textContent = "";
  lock.style.display = "none";

  startFloaties();
  startAutoRotate();

  // Start music on unlock (user gesture)
  if(music.paused){
    music.play().catch(()=>{});
    musicBtn.textContent = "Pause Music";
  }
}

// ===== WIRE EVENTS =====
enterBtn.addEventListener("click", unlock);
pw.addEventListener("keydown", (e)=>{ if(e.key === "Enter") unlock(); });

musicBtn.addEventListener("click", toggleMusic);
voiceBtn.addEventListener("click", playVoice);
noteBtn.addEventListener("click", loveNote);
themesBtn.addEventListener("click", openThemeSheet);

prevBtn.addEventListener("click", prevPhoto);
nextBtn.addEventListener("click", nextPhoto);

penguinImg.addEventListener("click", penguinTap);

sheetOverlay.addEventListener("click", closeThemeSheet);
closeSheetBtn.addEventListener("click", closeThemeSheet);

document.querySelectorAll(".sheetBtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const idx = Number(btn.dataset.theme);
    applyTheme(idx);
    closeThemeSheet();
  });
});
</script>
