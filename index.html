<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Penguin Love 🐧❤️</title>

<style>
body {
  margin: 0;
  padding: 0;
  text-align: center;
  font-family: "Comic Sans MS", cursive;
  overflow: hidden;
  background: linear-gradient(#ffd6e8, #ffeef5);
}

h1 {
  color: #ff4081;
  margin-top: 15px;
}

.names {
  font-size: 22px;
  color: #333;
}

.anniversary {
  font-size: 16px;
  color: #555;
  margin-bottom: 10px;
}

.penguins {
  width: 300px;
  animation: pulse 2s infinite alternate;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.06); }
}

.kiss, .heart, .sparkle {
  position: absolute;
  pointer-events: none;
  animation: floatUp 6s linear forwards;
}

@keyframes floatUp {
  0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
}

.gallery {
  width: 200px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(255,0,120,0.4);
}

.signature {
  position: fixed;
  bottom: 10px;
  width: 100%;
  font-size: 14px;
  color: #777;
}

.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 182, 213, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.popup-content {
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 80%;
  box-shadow: 0 0 25px rgba(255,0,120,0.4);
}

.popup button {
  margin-top: 15px;
  padding: 10px 20px;
  background: #ff4081;
  color: white;
  border: none;
  border-radius: 20px;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="popup" id="popup">
  <div class="popup-content">
    <h2>For My Forever Love 💖</h2>
    <p>
      Sarah, I love you more than words can ever explain.  
      Every kiss, every moment, every memory is forever ours.
    </p>
    <button onclick="startLove()">Tap to Begin 💕</button>
  </div>
</div>

<h1>I love you sooo very much 💋</h1>
<div class="names">Sarah ❤️ Ricardo</div>
<div class="anniversary">Anniversary: September 17, 2024</div>

<img src="penguins.png" class="penguins" alt="Penguins in love">
<img id="gallery" class="gallery" src="photo1.jpg">

<div class="signature">Forever Yours — Ricardo 🐧❤️</div>

<audio id="music" src="music.mp3" loop></audio>
<audio id="voice" src="voice.mp3"></audio>

<script>
const music = document.getElementById("music");
const voice = document.getElementById("voice");
const popup = document.getElementById("popup");
const gallery = document.getElementById("gallery");

const photos = ["photo1.jpg","photo2.jpg","photo3.jpg"];
let index = 0;

function randomX() {
  return Math.random() * 100 + "vw";
}

function spawn(type, content, size) {
  const el = document.createElement("div");
  el.className = type;
  el.innerHTML = content;
  el.style.left = randomX();
  el.style.fontSize = size + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

function startLove() {
  popup.style.display = "none";
  music.play();
  voice.play();

  setInterval(() => {
    const kiss = document.createElement("img");
    kiss.src = "kiss.png";
    kiss.className = "kiss";
    kiss.style.left = randomX();
    kiss.style.width = 50 + Math.random()*20 + "px";
    document.body.appendChild(kiss);
    setTimeout(() => kiss.remove(), 6000);
  }, 500);

  setInterval(() => spawn("heart","❤️",20 + Math.random()*30), 700);
  setInterval(() => spawn("sparkle","✨",12 + Math.random()*15), 300);

  setInterval(() => {
    index = (index + 1) % photos.length;
    gallery.src = photos[index];
  }, 2500);
}
</script>

</body>
</html>
