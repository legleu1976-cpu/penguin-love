
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penguin Love</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    width: 100%;
    background-color: #fff0f5;
    font-family: 'Arial', sans-serif;
    position: relative;
  }

  #container {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
  }

  #penguins {
    width: 70%;
    max-width: 300px;
    margin-top: 50px;
  }

  h1 {
    color: #ff69b4;
    margin: 10px 0 0 0;
  }

  h2 {
    color: #ff0000;
    margin: 5px 0;
  }

  h3 {
    color: #ffa500;
    margin: 5px 0;
    font-weight: bold;
    font-size: 1rem;
  }

  .kiss {
    position: absolute;
    width: 40px;
    height: 40px;
    pointer-events: none;
    opacity: 0.8;
    animation: float 3s linear forwards;
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(-400px) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>
<div id="container">
  <img id="penguins" src="penguins.png" alt="Penguins Hugging">
  <h1>Sarah & Ricardo</h1>
  <h2>I love you sooo very much!</h2>
  <h3>Our Anniversary: September 17, 2024</h3>
</div>

<script>
  const container = document.getElementById('container');

  function createKiss() {
    const kiss = document.createElement('img');
    kiss.src = 'kiss.png';
    kiss.className = 'kiss';
    kiss.style.left = Math.random() * window.innerWidth + 'px';
    kiss.style.top = window.innerHeight + 'px';
    kiss.style.width = 20 + Math.random() * 40 + 'px';
    kiss.style.height = kiss.style.width;
    kiss.style.animationDuration = 2 + Math.random() * 2 + 's';
    container.appendChild(kiss);

    setTimeout(() => {
      kiss.remove();
    }, 4000);
  }

  setInterval(createKiss, 200);
</script>
</body>
</html>
