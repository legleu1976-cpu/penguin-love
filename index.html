<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Penguin Love 🐧❤️</title>

<style>
:root{
  --bg1:#ffd6e8;
  --bg2:#fff0f7;
  --accent:#ff4081;
  --text:#111;
  --font:"Comic Sans MS", cursive;
  --msgBg: rgba(0,0,0,0.35);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  text-align:center;
  font-family: var(--font);
  background: linear-gradient(var(--bg1), var(--bg2));
  color: var(--text);
  overflow:hidden;
}

button{
  background: var(--accent);
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:20px;
  font-size:16px;
  margin:6px;
}

.smallBtn{ font-size:15px; padding:8px 14px; }

.penguins{
  width:280px;
  cursor:pointer;
  animation:pulse 2s infinite alternate;
}
@keyframes pulse{ from{transform:scale(1);} to{transform:scale(1.06);} }

.meter{
  width:80%;
  max-width:520px;
  height:12px;
  background:#eee;
  margin:10px auto;
  border-radius:10px;
  overflow:hidden;
}
.fill{ height:100%; width:0; background:var(--accent); }

.galleryWrap{
  position:relative;
  display:inline-block;
  margin-top:10px;
  padding-bottom:60px;
}

#gallery{
  width:230px;
  border-radius:12px;
  transition:opacity .9s;
}

#photoMessage{
  position:absolute;
  left:0; right:0;
  bottom:60px;
  padding:6px 0;
  background:var(--msgBg);
  color:white;
  font-size:14px;
  border-bottom-left-radius:12px;
  border-bottom-right-radius:12px;
  transition:opacity .9s;
}

.float{
  position:absolute;
  pointer-events:none;
  animation:rise 6s linear forwards;
}
@keyframes rise{
  from{transform:translateY(110vh); opacity:1;}
  to{transform:translateY(-20vh); opacity:0;}
}

/* LOCK */
#lock{
  position:fixed; inset:0;
  background:rgba(255,182,213,.96);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.lockBox{
  background:white;
  padding:20px;
  border-radius:16px;
  width:85%;
  max-width:400px;
}
#status{ min-height:18px; color:#b00020; }

/* THEME SHEET */
#sheetOverlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.35);
  display:none;
}
#themeSheet{
  position:fixed;
  left:0; right:0;
  bottom:-320px;
  background:white;
  border-top-left-radius:18px;
  border-top-right-radius:18px;
  padding:14px;
  transition:bottom .25s ease;
}
#themeSheet.open{ bottom:0; }
.sheetBtn{ background:white; color:#111; border:1px solid #ccc; }
</style>
</head>

<body>

<div id="lock">
  <div class="lockBox">
    <h2>🐧 Secret Love 🐧</h2>
    <p>What’s our word?</p>
    <input id="pw" type="password" style="padding:10px;width:80%;border-radius:12px;border:1px solid #ccc">
    <br><br>
    <button id="enterBtn">Enter</button>
    <div id="status"></div>
  </div>
</div>

<h2>Sarah ❤️ Ricardo</h2>
<p>Anniversary: September 17, 2024</p>
<p id="countdown"></p>

<img src="penguins.png" class="penguins" id="penguin">

<div class="meter"><div class="fill" id="fill"></div></div>

<div class="galleryWrap">
  <img id="gallery" src="photo1.jpg">
  <div id="photoMessage">Our first memory together 💖</div>
  <div style="position:absolute;bottom:0;left:0;right:0;">
    <button class="smallBtn" id="prev">⏮ Prev</button>
    <button class="smallBtn" id="next">Next ⏭</button>
  </div>
</div>

<div>
  <button id="voiceBtn">Hear My Voice</button>
  <button id="noteBtn">Love Note</button>
  <button id="themesBtn">Themes</button>
  <button id="musicBtn">Play Music</button>
</div>

<div class="signature">Forever Yours — Ricardo</div>

<audio id="music" src="music.mp3" loop></audio>
<audio id="voice" src="voice.mp3"></audio>

<div id="sheetOverlay"></div>
<div id="themeSheet">
  <button class="sheetBtn" data-theme="0">🐧 Penguin</button>
  <button class="sheetBtn" data-theme="1">❤️ Heart</button>
  <button class="sheetBtn" data-theme="2">🍷 Wine</button>
</div>

<script>
const SECRET="love";
let photoSpeed=9000;

const photos=[
 {src:"photo1.jpg",msg:"Our first memory together 💖"},
 {src:"photo2.jpg",msg:"Adventure together ✈️"},
 {src:"photo3.jpg",msg:"Laughing together 🐧"},
 {src:"photo4.jpg",msg:"A cozy night 💕"},
 {src:"photo5.jpg",msg:"One of my favorites ❤️"},
 {src:"photo6.jpg",msg:"Forever love ✨"},
 {src:"photo7.jpg",msg:"Special memories 💌"},
 {src:"photo8.jpg",msg:"Another beautiful moment 💕"},
 {src:"photo9.jpg",msg:"Always you ❤️"}
];

let i=0, hearts=0, autoRotate;

const gallery=document.getElementById("gallery");
const msg=document.getElementById("photoMessage");
const fill=document.getElementById("fill");
const music=document.getElementById("music");
const voice=document.getElementById("voice");

function show(n){
  gallery.style.opacity=0;
  msg.style.opacity=0;
  setTimeout(()=>{
    gallery.src=photos[n].src;
    msg.textContent=photos[n].msg;
    gallery.style.opacity=1;
    msg.style.opacity=1;
    i=n;
  },500);
}

document.getElementById("next").onclick=()=>show((i+1)%photos.length);
document.getElementById("prev").onclick=()=>show((i-1+photos.length)%photos.length);

document.getElementById("penguin").onclick=()=>{
  hearts++;
  fill.style.width=Math.min(hearts*10,100)+"%";
  if(hearts===10) alert("💖 You are my forever 💖");
};

document.getElementById("musicBtn").onclick=()=>{
  if(music.paused){ music.play(); musicBtn.textContent="Pause Music"; }
  else{ music.pause(); musicBtn.textContent="Play Music"; }
};

document.getElementById("voiceBtn").onclick=()=>{
  music.pause(); musicBtn.textContent="Play Music";
  voice.currentTime=0; voice.play();
};

document.getElementById("noteBtn").onclick=()=>{
  alert("I love you more every single day ❤️");
};

document.getElementById("themesBtn").onclick=()=>{
  document.getElementById("sheetOverlay").style.display="block";
  document.getElementById("themeSheet").classList.add("open");
};

document.getElementById("sheetOverlay").onclick=()=>{
  sheetOverlay.style.display="none";
  themeSheet.classList.remove("open");
};

document.querySelectorAll(".sheetBtn").forEach(b=>{
  b.onclick=()=>{ sheetOverlay.click(); };
});

document.getElementById("enterBtn").onclick=()=>{
  if(pw.value.trim()!==SECRET){ status.textContent="Wrong password 💖"; return; }
  lock.style.display="none";
  autoRotate=setInterval(()=>show((i+1)%photos.length),photoSpeed);
};

function countdown(){
  const d=new Date("2024-09-17");
  const now=new Date();
  countdownEl.textContent=Math.floor(Math.abs(now-d)/86400000)+" days together 💕";
}
const countdownEl=document.getElementById("countdown");
setInterval(countdown,60000); countdown();
</script>

</body>
</html>
