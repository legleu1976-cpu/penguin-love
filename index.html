<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Penguin Love 🐧❤️</title>

<style>
:root {
  --bg1:#ffd6e8;
  --bg2:#fff0f7;
  --accent:#ff4081;
}
body {
  margin:0;
  text-align:center;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(var(--bg1),var(--bg2));
  overflow:hidden;
}
.hidden {display:none;}
button {
  background:var(--accent);
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:20px;
  font-size:16px;
  margin:8px;
}
.penguins {
  width:280px;
  animation:pulse 2s infinite alternate;
  cursor:pointer;
}
@keyframes pulse {from{transform:scale(1);}to{transform:scale(1.06);}}
.float {
  position:absolute;
  animation:rise 6s linear forwards;
}
@keyframes rise {
  from {transform:translateY(110vh) rotate(0deg); opacity:1;}
  to {transform:translateY(-20vh) rotate(360deg); opacity:0;}
}
.popup {
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(255,182,213,.96);
  display:flex;align-items:center;justify-content:center;
  z-index:999;
}
.box {
  background:white;padding:20px;border-radius:15px;width:80%;
}
.signature {
  position:fixed;bottom:8px;width:100%;font-size:14px;color:#777;
}
.timeline {
  max-height:120px;overflow:auto;margin:10px;font-size:14px;
}
.meter {
  width:80%;height:12px;background:#eee;margin:10px auto;border-radius:10px;
}
.fill {
  height:100%;width:0;background:var(--accent);border-radius:10px;
}
.gallery-container {
  position:relative;
  display:inline-block;
  margin-top:10px;
}
#gallery {
  width:200px;
  border-radius:12px;
  transition: opacity 1s;
}
#photoMessage {
  position:absolute;
  bottom:5px;
  width:100%;
  color:white;
  text-shadow:0 0 5px black;
  font-size:14px;
  transition: opacity 1s;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div class="popup" id="lock">
  <div class="box">
    <h2>🐧 Secret Love 🐧</h2>
    <p>What’s our word?</p>
    <input id="pw" type="password">
    <br><br>
    <button onclick="unlock()">Enter</button>
  </div>
</div>

<!-- MAIN -->
<h2>Sarah ❤️ Ricardo</h2>
<p>Anniversary: September 17, 2024</p>
<p id="countdown"></p>

<img src="penguins.png" class="penguins" onclick="penguinTap()">

<div class="meter"><div id="fill" class="fill"></div></div>

<div class="gallery-container">
  <img id="gallery" src="photo1.jpg">
  <div id="photoMessage">Our first memory together 💖</div>
</div>

<div>
  <button onclick="playVoice()">Hear My Voice</button>
  <button onclick="loveNote()">Love Note</button>
  <button onclick="toggleTheme()">Theme</button>
  <button id="musicBtn" onclick="toggleMusic()">Play Music</button>
</div>

<div class="timeline">
  💕 First kiss<br>
  ✈️ First trip<br>
  🐧 First penguin love app<br>
  ❤️ Forever
</div>

<div class="signature">Forever Yours — Ricardo</div>

<audio id="music" src="music.mp3" loop></audio>
<audio id="voice" src="voice.mp3"></audio>

<script>
// ======== PASSWORD ========
const SECRET="love";
function unlock(){
  if(pw.value===SECRET){
    lock.style.display="none";
    if(music.paused){ music.play(); musicBtn.innerText="Pause Music"; }
    setInterval(spawn,500);
    setInterval(showNextPhoto,3000);
  }
}

// ======== HEART METER ========
let hearts=0;
const fill=document.getElementById("fill");
function penguinTap(){
  hearts++;
  fill.style.width=Math.min(hearts*10,100)+"%";
  if(hearts===10) alert("💖 Secret Message: You are my forever 💖");
}

// ======== LOVE NOTES ========
function loveNote(){
  const notes=[
    "You are my favorite person ❤️",
    "I’d choose you in every lifetime",
    "My heart is yours forever",
    "You are my home"
  ];
  alert(notes[Math.floor(Math.random()*notes.length)]);
}

// ======== THEME SWITCHER ========
let theme=false;
function toggleTheme(){
  theme=!theme;
  document.documentElement.style.setProperty("--bg1",theme?"#1a1a2e":"#ffd6e8");
  document.documentElement.style.setProperty("--bg2",theme?"#16213e":"#fff0f7");
}

// ======== VOICE ========
const music=document.getElementById("music");
const voice=document.getElementById("voice");
const musicBtn=document.getElementById("musicBtn");
function playVoice(){
  // Stop background music
  if(!music.paused){
    music.pause();
    musicBtn.innerText="Play Music";
  }
  voice.play();
}

// ======== PLAY/PAUSE MUSIC TOGGLE ========
function toggleMusic(){
  if(music.paused){
    music.play();
    musicBtn.innerText="Pause Music";
  } else {
    music.pause();
    musicBtn.innerText="Play Music";
  }
}

// ======== FLOATING HEARTS & SPARKLES ========
function spawn(){
  const el=document.createElement("div");
  el.className="float";
  el.innerHTML=Math.random()>.5?"❤️":"✨";
  el.style.left=Math.random()*100+"vw";
  el.style.fontSize=20+Math.random()*20+"px";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),6000);
}

// ======== COUNTDOWN ========
function updateCountdown(){
  const d=new Date("2024-09-17");
  const now=new Date();
  const diff=Math.abs(now-d);
  countdown.innerText=Math.floor(diff/86400000)+" days together 💕";
}
setInterval(updateCountdown,60000);updateCountdown();

// ======== PHOTO GALLERY + CROSSFADE + MESSAGES ========
const photos = [
  {src:"photo1.jpg", msg:"Our first memory together 💖"},
  {src:"photo2.jpg", msg:"Adventure on our first trip ✈️"},
  {src:"photo3.jpg", msg:"Laughing together 🐧"},
  {src:"photo4.jpg", msg:"A cozy night 💕"},
  {src:"photo5.jpg", msg:"Our favorite moment ❤️"},
  {src:"photo6.jpg", msg:"Forever love ✨"},
  {src:"photo7.jpg", msg:"Special memories together 💌"}
];
let photoIndex = 0;
const gallery=document.getElementById("gallery");
const photoMessage=document.getElementById("photoMessage");

function showNextPhoto(){
  const nextIndex=(photoIndex+1)%photos.length;
  gallery.style.opacity=0;
  photoMessage.style.opacity=0;
  setTimeout(()=>{
    gallery.src=photos[nextIndex].src;
    photoMessage.innerText=photos[nextIndex].msg;
    gallery.style.opacity=1;
    photoMessage.style.opacity=1;
    photoIndex=nextIndex;
  },1000);
}
</script>

</body>
</html>
