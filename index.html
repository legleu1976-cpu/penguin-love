<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Penguin Love 💕</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(#ff9acb, #ffd6e7);
  overflow: hidden;
  font-family: "Comic Sans MS", cursive;
  text-align: center;
}

h1 {
  margin-top: 20px;
  color: #fff;
  text-shadow: 0 0 10px hotpink;
}

.penguins {
  width: 300px;
  margin-top: 20px;
  animation:
    cuddle 3.5s ease-in-out infinite,
    noseWiggle 1.8s ease-in-out infinite;
  transform-origin: center bottom;
  filter: drop-shadow(0 0 18px rgba(255,64,129,0.7));
}

.tap-cuddle {
  animation: cuddle 1.2s ease-in-out !important;
}

@keyframes cuddle {
  0% { transform: scale(1) rotate(0); }
  25% { transform: scale(1.03) rotate(-1deg); }
  50% { transform: scale(1.06); }
  75% { transform: scale(1.03) rotate(1deg); }
  100% { transform: scale(1); }
}

@keyframes noseWiggle {
  0%,100% { transform: translateX(0); }
  50% { transform: translateX(2px); }
}

.kiss {
  position: absolute;
  font-size: 30px;
  animation: floatUp 6s linear forwards;
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-100px); opacity: 0; }
}

.pop-heart {
  position: absolute;
  font-size: 26px;
  pointer-events: none;
  animation: popFloat 1.5s ease-out forwards;
}

@keyframes popFloat {
  from { transform: scale(0.2); opacity: 1; }
  to { transform: scale(1.4) translateY(-80px); opacity: 0; }
}

.photo {
  width: 160px;
  border-radius: 12px;
  margin-top: 15px;
  box-shadow: 0 0 15px hotpink;
}
</style>
</head>

<body>

<h1>Sarah ❤️ Ricardo</h1>
<p>Anniversary: September 17, 2024</p>

<img src="penguins.png" class="penguins" alt="Penguins in love" />

<br />
<img id="photo" class="photo" src="photo1.jpg" />

<audio id="music" src="music.mp3" loop></audio>

<script>
let started = false;
const penguin = document.querySelector(".penguins");
const music = document.getElementById("music");
const photo = document.getElementById("photo");

const photos = ["photo1.jpg", "photo2.jpg", "photo3.jpg"];
let photoIndex = 0;

/* ❤️ heart pop */
function popHeart(x, y) {
  const heart = document.createElement("div");
  heart.className = "pop-heart";
  heart.innerHTML = "❤️";
  heart.style.left = x + "px";
  heart.style.top = y + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 1500);
}

/* 💋 floating kisses */
function createKiss() {
  const kiss = document.createElement("div");
  kiss.className = "kiss";
  kiss.innerHTML = "💋";
  kiss.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(kiss);
  setTimeout(() => kiss.remove(), 6000);
}

/* 🌟 start app */
function startLove() {
  if (started) return;
  started = true;

  music.play();

  setInterval(createKiss, 800);
  setInterval(() => {
    photoIndex = (photoIndex + 1) % photos.length;
    photo.src = photos[photoIndex];
  }, 4000);
}

/* 🐧 tap interaction */
penguin.addEventListener("click", (e) => {
  startLove();

  penguin.classList.remove("tap-cuddle");
  void penguin.offsetWidth;
  penguin.classList.add("tap-cuddle");

  for (let i = 0; i < 6; i++) {
    popHeart(
      e.clientX + Math.random() * 40 - 20,
      e.clientY + Math.random() * 40 - 20
    );
  }
});
</script>

</body>
</html>
