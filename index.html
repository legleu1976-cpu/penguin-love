<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Penguin Love 🐧❤️</title>

<style>
:root{
  --bg1:#ffd6e8;
  --bg2:#fff0f7;
  --accent:#ff4081;
  --text:#111;
  --font:"Comic Sans MS", cursive;
  --msgBg: rgba(0,0,0,0.35);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  text-align:center;
  font-family: var(--font);
  background: linear-gradient(var(--bg1), var(--bg2));
  color: var(--text);
  overflow:hidden;
}

h2{ margin: 14px 0 2px; }
p{ margin: 6px 0; }

button{
  background: var(--accent);
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:20px;
  font-size:16px;
  margin:6px;
}

.smallBtn{ padding:9px 14px; font-size:15px; }

.penguins{
  width: 280px;
  margin-top: 6px;
  cursor:pointer;
  animation: pulse 2s infinite alternate;
}
@keyframes pulse{ from{transform:scale(1);} to{transform:scale(1.06);} }

.meter{
  width: 84%;
  max-width: 520px;
  height: 12px;
  background:#eee;
  margin: 10px auto;
  border-radius: 10px;
  overflow:hidden;
}
.fill{
  height:100%;
  width:0;
  background: var(--accent);
}

.galleryWrap{
  display:inline-block;
  position:relative;
  margin-top: 8px;
}
#gallery{
  width: 230px;
  border-radius: 12px;
  transition: opacity 0.9s;
  box-shadow: 0 0 20px rgba(0,0,0,0.12);
}
#photoMessage{
  position:absolute;
  left:0; right:0;
  bottom:0;
  padding: 7px 0;
  border-bottom-left-radius:12px;
  border-bottom-right-radius:12px;
  background: var(--msgBg);
  color:white;
  text-shadow:0 0 5px rgba(0,0,0,0.6);
  font-size:14px;
  transition: opacity 0.9s;
}

.timeline{
  width: 92%;
  max-width: 560px;
  margin: 10px auto;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(255,255,255,0.35);
  font-size: 14px;
  max-height: 120px;
  overflow:auto;
}

.signature{
  position:fixed;
  bottom: 8px;
  left:0; right:0;
  font-size: 14px;
  color: rgba(0,0,0,0.55);
}

/* floating emojis */
.float{
  position:absolute;
  pointer-events:none;
  animation: rise 6s linear forwards;
}
@keyframes rise{
  from{ transform: translateY(110vh) rotate(0deg); opacity:1; }
  to{ transform: translateY(-20vh) rotate(360deg); opacity:0; }
}

/* LOCK SCREEN */
#lock{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background: rgba(255,182,213,0.96);
  z-index: 999;
}
.lockBox{
  width: 86%;
  max-width: 420px;
  background: white;
  border-radius: 16px;
  padding: 18px 16px 16px;
  box-shadow: 0 0 25px rgba(0,0,0,0.12);
}
.lockBox input{
  width: 78%;
  max-width: 280px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 16px;
}
#status{
  min-height: 18px;
  margin-top: 10px;
  font-size: 14px;
  color: #b00020;
}

/* Theme Bottom Sheet */
#sheetOverlay{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  display:none;
  z-index: 998;
}
#themeSheet{
  position: fixed;
  left:0; right:0;
  bottom: -340px;
  background: rgba(255,255,255,0.92);
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
  padding: 14px 14px 22px;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.25);
  transition: bottom 0.25s ease;
  z-index: 999;
}
#themeSheet.open{ bottom: 0; }
.sheetHandle{
  width:44px; height:5px;
  background: rgba(0,0,0,0.20);
  border-radius:999px;
  margin:6px auto 12px;
}
.sheetTitle{ margin:0 0 10px; font-size:16px; }
.sheetRow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.sheetBtn{
  padding:10px 14px;
  border-radius:16px;
  border:1px solid rgba(0,0,0,0.12);
  background:white;
  color:#111;
  font-size:16px;
}
</style>
</head>

<body>

<!-- LOCK -->
<div id="lock">
  <div class="lockBox">
    <h2 style="margin:0 0 8px;">🐧 Secret Love 🐧</h2>
    <p style="margin:0 0 10px;">What’s our word?</p>
    <input id="pw" type="password" placeholder="Password" />
    <div>
      <button id="enterBtn" style="margin-top:12px;">Enter</button>
    </div>
    <div id="status"></div>
    <p style="font-size:12px;opacity:.65;margin:8px 0 0;">Tip: you can also press Return.</p>
  </div>
</div>

<!-- MAIN -->
<h2>Sarah ❤️ Ricardo</h2>
<p>Anniversary: September 17, 2024</p>
<p id="countdown"></p>

<img src="penguins.png" class="penguins" id="penguinImg" alt="Penguins in love" />

<div class="meter"><div class="fill" id="fill"></div></div>

<div class="galleryWrap">
  <img id="gallery" src="photo1.jpg" alt="Memories" />
  <div id="photoMessage">Our first memory together 💖</div>
  <div style="margin-top:10px;">
    <button class="smallBtn" id="prevBtn">⏮ Previous</button>
    <button class="smallBtn" id="nextBtn">Next ⏭</button>
  </div>
</div>

<div style="margin-top:10px;">
  <button id="voiceBtn">Hear My Voice</button>
  <button id="noteBtn">Love Note</button>
  <button id="themesBtn">Themes</button>
  <button id="musicBtn">Play Music</button>
</div>

<div class="timeline">
  💕 First kiss<br>
  ✈️ First trip<br>
  🐧 First penguin love app<br>
  ❤️ Forever
</div>

<div class="signature">Forever Yours — Ricardo</div>

<audio id="music" src="music.mp3" loop></audio>
<audio id="voice" src="voice.mp3"></audio>

<!-- THEME SHEET -->
<div id="sheetOverlay"></div>
<div id="themeSheet" aria-hidden="true">
  <div class="sheetHandle"></div>
  <p class="sheetTitle">Choose a theme</p>
  <div class="sheetRow">
    <button class="sheetBtn" data-theme="0">🐧 Penguin</button>
    <button class="sheetBtn" data-theme="1">❤️ Heart</button>
    <button class="sheetBtn" data-theme="2">🍷 Wine</button>
  </div>
  <div style="margin-top:12px;">
    <button id="closeSheetBtn">Close</button>
  </div>
</div>

<script>
/* ================== EDIT THESE ================== */
const SECRET = "love";
let photoSpeed = 9000; // ms (slower = bigger). example: 12000
/* =============================================== */

// Elements
const el = (id)=>document.getElementById(id);
const lock = el("lock");
const pw = el("pw");
const status = el("status");
const enterBtn = el("enterBtn");

const music = el("music");
const voice = el("voice");
const musicBtn = el("musicBtn");

const penguinImg = el("penguinImg");
const fill = el("fill");

const gallery = el("gallery");
const photoMessage = el("photoMessage");
const prevBtn = el("prevBtn");
const nextBtn = el("nextBtn");

const voiceBtn = el("voiceBtn");
const noteBtn = el("noteBtn");
const themesBtn = el("themesBtn");

const sheetOverlay = el("sheetOverlay");
const themeSheet = el("themeSheet");
const closeSheetBtn = el("closeSheetBtn");

// Themes
const THEMES = [
  { name:"🐧 Penguin", bg1:"#b3e5fc", bg2:"#e1f5fe", accent:"#1565c0", text:"#0b1b2b",
    font:'"Trebuchet MS", Arial, sans-serif', msgBg:"rgba(21,101,192,0.45)", floats:["🐧","❄️","✨"] },
  { name:"❤️ Heart", bg1:"#ffd6e8", bg2:"#fff0f7", accent:"#ff4081", text:"#2a0b14",
    font:'"Comic Sans MS", cursive', msgBg:"rgba(255,64,129,0.45)", floats:["❤️","💖","✨"] },
  { name:"🍷 Wine", bg1:"#2b0b17", bg2:"#4b1230", accent:"#c2185b", text:"#fff5f8",
    font:'Georgia, "Times New Roman", serif', msgBg:"rgba(194,24,91,0.45)", floats:["🍷","🥂","✨"] }
];
let themeIndex = 1;

function applyTheme(idx){
  const t = THEMES[idx];
  document.documentElement.style.setProperty("--bg1", t.bg1);
  document.documentElement.style.setProperty("--bg2", t.bg2);
  document.documentElement.style.setProperty("--accent", t.accent);
  document.documentElement.style.setProperty("--text", t.text);
  document.documentElement.style.setProperty("--font", t.font);
  document.documentElement.style.setProperty("--msgBg", t.msgBg);
  themeIndex = idx;
}
applyTheme(themeIndex);

// Photo list (9 photos)
const photos = [
  {src:"photo1.jpg", msg:"Our first memory together 💖"},
  {src:"photo2.jpg", msg:"Adventure on our first trip ✈️"},
  {src:"photo3.jpg", msg:"Laughing together 🐧"},
  {src:"photo4.jpg", msg:"A cozy night 💕"},
  {src:"photo5.jpg", msg:"Our favorite moment ❤️"},
  {src:"photo6.jpg", msg:"Forever love ✨"},
  {src:"photo7.jpg", msg:"Special memories together 💌"},
  {src:"photo8.jpg", msg:"Another beautiful memory 💕"},
  {src:"photo9.jpg", msg:"One of my favorite moments with you ❤️"}
];

let photoIndex = 0;
let autoRotate = null;
let floatTimer = null;
let hearts = 0;

// Crossfade show
function showPhoto(index){
  gallery.style.opacity = 0;
  photoMessage.style.opacity = 0;

  setTimeout(()=>{
    gallery.src = photos[index].src;
    photoMessage.textContent = photos[index].msg;
    gallery.style.opacity = 1;
    photoMessage.style.opacity = 1;
    photoIndex = index;
  }, 650);
}

function nextPhoto(){ showPhoto((photoIndex + 1) % photos.length); }
function prevPhoto(){ showPhoto((photoIndex - 1 + photos.length) % photos.length); }

function setPhotoSpeed(ms){
  photoSpeed = ms;
  if(autoRotate){
    clearInterval(autoRotate);
    autoRotate = setInterval(nextPhoto, photoSpeed);
  }
}

// Floating emojis
function spawnFloat(){
  const t = THEMES[themeIndex];
  const f = document.createElement("div");
  f.className = "float";
  f.innerHTML = t.floats[Math.floor(Math.random() * t.floats.length)];
  f.style.left = (Math.random()*100) + "vw";
  f.style.fontSize = (18 + Math.random()*22) + "px";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(), 6000);
}

// Countdown
function updateCountdown(){
  const d = new Date("2024-09-17");
  const now = new Date();
  const diff = Math.abs(now - d);
  el("countdown").textContent = Math.floor(diff/86400000) + " days together 💕";
}
setInterval(updateCountdown, 60000);
updateCountdown();

// Music toggle
function toggleMusic(){
  if(music.paused){
    music.play().catch(()=>{});
    musicBtn.textContent = "Pause Music";
  } else {
    music.pause();
    musicBtn.textContent = "Play Music";
  }
}

// Voice (pause music)
function playVoice(){
  if(!music.paused){
    music.pause();
    musicBtn.textContent = "Play Music";
  }
  voice.currentTime = 0;
  voice.play().catch(()=>{});
}

// Love notes
function loveNote(){
  const notes = [
    "You are my favorite person ❤️",
    "I’d choose you in every lifetime 💫",
    "My heart is yours forever 🐧💖",
    "You are my home 🏡",
    "I love you more than yesterday… and less than tomorrow 💞"
  ];
  alert(notes[Math.floor(Math.random()*notes.length)]);
}

// Heart meter
function penguinTap(){
  hearts++;
  fill.style.width = Math.min(hearts*10, 100) + "%";
  if(hearts === 10) alert("💖 Secret Message: You are my forever 💖");
}

// Theme sheet
function openThemeSheet(){
  sheetOverlay.style.display = "block";
  themeSheet.classList.add("open");
  themeSheet.setAttribute("aria-hidden","false");
}
function closeThemeSheet(){
  themeSheet.classList.remove("open");
  themeSheet.setAttribute("aria-hidden","true");
  setTimeout(()=>{ sheetOverlay.style.display="none"; }, 200);
}

// Unlock (never silent)
function unlock(){
  const typed = (pw.value || "").trim();
  if(!typed){
    status.textContent = "Type the password first 🙂";
    return;
  }
  if(typed !== SECRET){
    status.textContent = "Wrong password. Try again 💖";
    return;
  }

  status.textContent = "";
  lock.style.display = "none";

  // Start floaties & auto-rotate
  if(!floatTimer) floatTimer = setInterval(spawnFloat, 550);
  if(autoRotate) clearInterval(autoRotate);
  autoRotate = setInterval(nextPhoto, photoSpeed);

  // Start music (iPhone requires a user gesture: this is one)
  if(music.paused){
    music.play().catch(()=>{});
    musicBtn.textContent = "Pause Music";
  }
}

// Wire events (no inline onclick)
enterBtn.addEventListener("click", unlock);
pw.addEventListener("keydown", (e)=>{ if(e.key === "Enter") unlock(); });

musicBtn.addEventListener("click", toggleMusic);
voiceBtn.addEventListener("click", playVoice);
noteBtn.addEventListener("click", loveNote);
themesBtn.addEventListener("click", openThemeSheet);

prevBtn.addEventListener("click", ()=>{ prevPhoto(); });
nextBtn.addEventListener("click", ()=>{ nextPhoto(); });

penguinImg.addEventListener("click", penguinTap);

sheetOverlay.addEventListener("click", closeThemeSheet);
closeSheetBtn.addEventListener("click", closeThemeSheet);

document.querySelectorAll(".sheetBtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const idx = Number(btn.dataset.theme);
    applyTheme(idx);
    closeThemeSheet();
  });
});
</script>

</body>
</html>
