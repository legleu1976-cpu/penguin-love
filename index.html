<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Penguin Love 🐧❤️</title>

<!-- iPhone Home Screen App -->
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Penguin Love">

<style>
:root{
  --bg1:#ffd6e8;
  --bg2:#fff0f7;
  --accent:#ff4081;
  --text:#111;
  --font:"Comic Sans MS", cursive;
  --msgBg: rgba(0,0,0,0.35);

  --frameGlow: rgba(255,64,129,0.45);
  --frameInset: rgba(255,255,255,0.35);
}

*{ box-sizing:border-box; }

html, body{
  height:100%;
  margin:0;
}

body{
  font-family: var(--font);
  background: linear-gradient(var(--bg1), var(--bg2));
  color: var(--text);
  overflow: hidden; /* body stays locked; app content scrolls */
  -webkit-text-size-adjust: 100%;
}

/* Scrollable app container (iPhone-safe) */
#app{
  position: relative;
  height: 100dvh;              /* better on iOS than 100vh */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  text-align: center;

  padding-top: calc(10px + env(safe-area-inset-top));
  padding-bottom: calc(110px + env(safe-area-inset-bottom)); /* room for bottom UI + home bar */
}

/* Keep content above float layer */
#app > *{
  position: relative;
  z-index: 3;
}

h2{ margin: 14px 0 4px; }
p{ margin: 6px 0; }

button{
  background: var(--accent);
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 16px;
  margin: 6px;
}

.smallBtn{ padding: 8px 14px; font-size: 15px; }

.penguins{
  width: 280px;
  cursor: pointer;
  animation: pulse 2s infinite alternate;
}
@keyframes pulse{ from{transform:scale(1);} to{transform:scale(1.06);} }

.meter{
  width: 80%;
  max-width: 520px;
  height: 12px;
  background: #eee;
  margin: 10px auto;
  border-radius: 10px;
  overflow: hidden;
}
.fill{ height:100%; width:0; background: var(--accent); transition: width .2s; }

.galleryWrap{
  position: relative;
  display: inline-block;
  margin-top: 10px;
  padding-bottom: 64px; /* room for buttons */
}

#gallery{
  width: 230px;
  border-radius: 12px;
  transition: opacity .9s;
  box-shadow: 0 0 18px rgba(0,0,0,0.12);
}

#photoMessage{
  position: absolute;
  left: 0; right: 0;
  bottom: 64px;
  padding: 6px 0;
  background: var(--msgBg);
  color: white;
  font-size: 14px;
  border-bottom-left-radius: 12px;
  border-bottom-right-radius: 12px;
  transition: opacity .9s;
  text-shadow: 0 0 6px rgba(0,0,0,0.6);
}

/* Float layer (prevents layout jank) */
#floatLayer{
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
}

.float{
  position: absolute;
  pointer-events: none;
  will-change: transform, opacity;
}

/* Fancy border frame */
.app-frame{
  position: fixed;
  inset: 10px;
  border-radius: 24px;
  pointer-events: none;
  z-index: 5;
  box-shadow:
    0 0 0 2px rgba(255,255,255,0.60),
    0 0 22px var(--frameGlow),
    inset 0 0 22px var(--frameInset);
}

/* LOCK */
#lock{
  position: fixed; inset: 0;
  background: rgba(255,182,213,.96);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.lockBox{
  background: white;
  padding: 20px;
  border-radius: 16px;
  width: 85%;
  max-width: 420px;
  box-shadow: 0 0 25px rgba(0,0,0,0.12);
}
.lockBox input{
  padding: 10px;
  width: 80%;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 16px;
}
#status{
  min-height: 18px;
  color: #b00020;
  margin-top: 10px;
}

/* THEME SHEET */
#sheetOverlay{
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  display: none;
  z-index: 998;
}
#themeSheet{
  position: fixed;
  left: 0; right: 0;
  bottom: -320px;
  background: rgba(255,255,255,0.92);
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
  padding: 14px;
  transition: bottom .25s ease;
  z-index: 999;
}
#themeSheet.open{ bottom: 0; }
.sheetBtn{
  background: white;
  color: #111;
  border: 1px solid #ccc;
  border-radius: 14px;
  padding: 10px 14px;
  margin: 6px;
}

/* Debug (only if errors) */
#debug{
  position: fixed;
  left: 10px; right: 10px;
  bottom: 10px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 10px;
  border-radius: 12px;
  font-size: 12px;
  text-align: left;
  display: none;
  z-index: 2000;
  white-space: pre-wrap;
}
</style>
</head>

<body>
<div class="app-frame"></div>
<div id="floatLayer"></div>
<div id="debug"></div>

<!-- LOCK -->
<div id="lock">
  <div class="lockBox">
    <h2>🐧 Secret Love 🐧</h2>
    <p>What’s our word?</p>
    <input id="pw" type="password" placeholder="Password" />
    <br><br>
    <button id="enterBtn">Enter</button>
    <div id="status"></div>
    <p style="font-size:12px;opacity:.65;margin:8px 0 0;">Tip: press Return/Enter too.</p>
  </div>
</div>

<!-- SCROLLABLE APP -->
<div id="app">
  <h2>Sarah ❤️ Ricardo</h2>
  <p>Anniversary: September 17, 2024</p>
  <p id="countdown"></p>

  <img src="penguins.png" class="penguins" id="penguinImg" alt="Penguins" />

  <div class="meter"><div class="fill" id="fill"></div></div>

  <div class="galleryWrap">
    <img id="gallery" src="photo1.jpg" alt="Photo" />
    <div id="photoMessage">Our first memory together 💖</div>

    <div style="position:absolute;bottom:0;left:0;right:0;">
      <button class="smallBtn" id="prevBtn">⏮ Prev</button>
      <button class="smallBtn" id="nextBtn">Next ⏭</button>
    </div>
  </div>

  <div>
    <button id="voiceBtn">Hear My Voice</button>
    <button id="noteBtn">Love Note</button>
    <button id="themesBtn">Themes</button>
    <button id="musicBtn">Play Music</button>
  </div>

  <div style="margin:14px auto; max-width:560px; width:92%; background:rgba(255,255,255,0.35); padding:10px 12px; border-radius:14px; font-size:14px;">
    💕 First kiss<br>
    ✈️ First trip<br>
    🐧 First penguin love app<br>
    ❤️ Forever
  </div>
</div>

<audio id="music" src="music.mp3" loop></audio>
<audio id="voice" src="voice.mp3"></audio>

<div id="sheetOverlay"></div>
<div id="themeSheet" aria-hidden="true">
  <p style="margin:0 0 8px;font-weight:bold;">Choose a theme</p>
  <button class="sheetBtn" data-theme="0">🐧 Penguin</button>
  <button class="sheetBtn" data-theme="1">❤️ Heart</button>
  <button class="sheetBtn" data-theme="2">🍷 Wine</button>
  <div style="margin-top:8px;">
    <button id="closeSheetBtn">Close</button>
  </div>
</div>

<script>
(() => {
  // Debug instead of white screen
  const debug = document.getElementById("debug");
  function showDebug(msg){ debug.style.display = "block"; debug.textContent = msg; }
  window.addEventListener("error", (e) => showDebug("ERROR: " + (e.message||e.error) + "\n" + (e.filename||"") + ":" + (e.lineno||"")));
  window.addEventListener("unhandledrejection", (e) => showDebug("PROMISE ERROR: " + (e.reason?.message || e.reason)));

  const SECRET = "love";
  let photoSpeed = 9000;

  // DOM
  const lock = document.getElementById("lock");
  const pw = document.getElementById("pw");
  const status = document.getElementById("status");
  const enterBtn = document.getElementById("enterBtn");

  const app = document.getElementById("app");
  const floatLayer = document.getElementById("floatLayer");

  const music = document.getElementById("music");
  const voice = document.getElementById("voice");
  const musicBtn = document.getElementById("musicBtn");

  const penguinImg = document.getElementById("penguinImg");
  const fill = document.getElementById("fill");

  const gallery = document.getElementById("gallery");
  const photoMessage = document.getElementById("photoMessage");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  const voiceBtn = document.getElementById("voiceBtn");
  const noteBtn = document.getElementById("noteBtn");
  const themesBtn = document.getElementById("themesBtn");

  const sheetOverlay = document.getElementById("sheetOverlay");
  const themeSheet = document.getElementById("themeSheet");
  const closeSheetBtn = document.getElementById("closeSheetBtn");

  // THEMES
  const THEMES = [
    {
      bg1:"#b3e5fc", bg2:"#e1f5fe", accent:"#1565c0", text:"#0b1b2b",
      font:'"Trebuchet MS", Arial, sans-serif', msgBg:"rgba(21,101,192,0.45)",
      frameGlow:"rgba(33,150,243,0.55)", frameInset:"rgba(255,255,255,0.45)",
      floats:["🐧","❄️","✨","❄️","✨"]
    },
    {
      bg1:"#ffd6e8", bg2:"#fff0f7", accent:"#ff4081", text:"#2a0b14",
      font:'"Comic Sans MS", cursive', msgBg:"rgba(255,64,129,0.45)",
      frameGlow:"rgba(255,64,129,0.55)", frameInset:"rgba(255,255,255,0.35)",
      floats:["❤️","💖","✨","💖","❤️"]
    },
    {
      bg1:"#2b0b17", bg2:"#4b1230", accent:"#c2185b", text:"#fff5f8",
      font:'Georgia, "Times New Roman", serif', msgBg:"rgba(194,24,91,0.45)",
      frameGlow:"rgba(194,24,91,0.70)", frameInset:"rgba(0,0,0,0.35)",
      floats:["🍷","🍷","🍷","🥂","✨","🍷","🥂"]
    }
  ];
  let themeIndex = 1;

  function applyTheme(idx){
    const t = THEMES[idx];
    document.documentElement.style.setProperty("--bg1", t.bg1);
    document.documentElement.style.setProperty("--bg2", t.bg2);
    document.documentElement.style.setProperty("--accent", t.accent);
    document.documentElement.style.setProperty("--text", t.text);
    document.documentElement.style.setProperty("--font", t.font);
    document.documentElement.style.setProperty("--msgBg", t.msgBg);
    document.documentElement.style.setProperty("--frameGlow", t.frameGlow);
    document.documentElement.style.setProperty("--frameInset", t.frameInset);
    themeIndex = idx;
  }
  applyTheme(themeIndex);

  // Photos
  const photos = [
    {src:"photo1.jpg", msg:"Our first memory together 💖"},
    {src:"photo2.jpg", msg:"Adventure on our first trip ✈️"},
    {src:"photo3.jpg", msg:"Laughing together 🐧"},
    {src:"photo4.jpg", msg:"A cozy night 💕"},
    {src:"photo5.jpg", msg:"Our favorite moment ❤️"},
    {src:"photo6.jpg", msg:"Forever love ✨"},
    {src:"photo7.jpg", msg:"Special memories together 💌"},
    {src:"photo8.jpg", msg:"Another beautiful memory 💕"},
    {src:"photo9.jpg", msg:"One of my favorite moments with you ❤️"}
  ];
  let photoIndex = 0;
  let autoRotate = null;

  function showPhoto(index){
    gallery.style.opacity = 0;
    photoMessage.style.opacity = 0;
    setTimeout(() => {
      gallery.src = photos[index].src;
      photoMessage.textContent = photos[index].msg;
      gallery.style.opacity = 1;
      photoMessage.style.opacity = 1;
      photoIndex = index;
    }, 650);
  }
  function nextPhoto(){ showPhoto((photoIndex + 1) % photos.length); }
  function prevPhoto(){ showPhoto((photoIndex - 1 + photos.length) % photos.length); }

  function startAutoRotate(){
    if(autoRotate) clearInterval(autoRotate);
    autoRotate = setInterval(nextPhoto, photoSpeed);
  }

  // Floaties (throttled + capped for smooth scrolling)
  let floatTimer = null;
  const MAX_FLOATS = 28;

  function spawnFloat(xPercent=null, burst=false){
    if(floatLayer.childElementCount >= MAX_FLOATS) return;

    const t = THEMES[themeIndex];
    const f = document.createElement("div");
    f.className = "float";
    f.textContent = t.floats[Math.floor(Math.random() * t.floats.length)];

    const left = (xPercent === null) ? (Math.random()*100) : xPercent;
    f.style.left = left + "vw";

    const size = burst ? (20 + Math.random()*26) : (16 + Math.random()*22);
    f.style.fontSize = size + "px";

    floatLayer.appendChild(f);

    const drift = (Math.random()*80 - 40);
    const spin  = (Math.random()*240 - 120);
    const dur   = burst ? (3.2 + Math.random()*1.4) : (5.2 + Math.random()*1.8);

    f.animate(
      [
        { transform:`translate(0,110vh) rotate(0deg)`, opacity:1 },
        { transform:`translate(${drift}px,-20vh) rotate(${spin}deg)`, opacity:0 }
      ],
      { duration: dur*1000, easing:"linear", fill:"forwards" }
    );

    setTimeout(()=>f.remove(), dur*1000 + 150);
  }

  function startFloaties(){
    if(floatTimer) return;
    floatTimer = setInterval(() => spawnFloat(), 800); // slower = smoother scrolling
  }

  function burstAtPenguin(){
    const base = 50 + (Math.random()*6 - 3);
    for(let k=0; k<12; k++){
      const x = base + (Math.random()*14 - 7);
      setTimeout(()=>spawnFloat(x, true), k*40);
    }
  }

  // Heart meter
  let hearts = 0;
  function penguinTap(){
    burstAtPenguin();
    hearts++;
    fill.style.width = Math.min(hearts*10, 100) + "%";
    if(hearts === 10) alert("💖 Secret Message: You are my forever 💖");
  }

  // Countdown
  function updateCountdown(){
    const d = new Date("2024-09-17");
    const now = new Date();
    const diff = Math.abs(now - d);
    document.getElementById("countdown").textContent =
      Math.floor(diff/86400000) + " days together 💕";
  }
  setInterval(updateCountdown, 60000);
  updateCountdown();

  // Music + Voice
  function toggleMusic(){
    if(music.paused){
      music.play().catch(()=>{});
      musicBtn.textContent = "Pause Music";
    } else {
      music.pause();
      musicBtn.textContent = "Play Music";
    }
  }
  function playVoice(){
    if(!music.paused){
      music.pause();
      musicBtn.textContent = "Play Music";
    }
    voice.currentTime = 0;
    voice.play().catch(()=>{});
  }

  // Notes
  function loveNote(){
    const notes = [
      "You are my favorite person ❤️",
      "I’d choose you in every lifetime 💫",
      "My heart is yours forever 🐧💖",
      "You are my home 🏡",
      "I love you more than yesterday… and less than tomorrow 💞"
    ];
    alert(notes[Math.floor(Math.random()*notes.length)]);
  }

  // Theme sheet
  function openThemeSheet(){
    sheetOverlay.style.display = "block";
    themeSheet.classList.add("open");
    themeSheet.setAttribute("aria-hidden","false");
  }
  function closeThemeSheet(){
    themeSheet.classList.remove("open");
    themeSheet.setAttribute("aria-hidden","true");
    setTimeout(()=>{ sheetOverlay.style.display = "none"; }, 200);
  }

  // Unlock
  function unlock(){
    const typed = (pw.value || "").trim();
    if(!typed){ status.textContent = "Type the password first 🙂"; return; }
    if(typed !== SECRET){ status.textContent = "Wrong password. Try again 💖"; return; }

    status.textContent = "";
    lock.style.display = "none";

    startFloaties();
    startAutoRotate();

    // iOS gesture → start music
    if(music.paused){
      music.play().catch(()=>{});
      musicBtn.textContent = "Pause Music";
    }

    // Smooth start: scroll to top
    app.scrollTo({ top: 0, behavior: "instant" });
  }

  // Events
  enterBtn.addEventListener("click", unlock);
  pw.addEventListener("keydown", (e)=>{ if(e.key === "Enter") unlock(); });

  prevBtn.addEventListener("click", prevPhoto);
  nextBtn.addEventListener("click", nextPhoto);

  penguinImg.addEventListener("click", penguinTap);

  musicBtn.addEventListener("click", toggleMusic);
  voiceBtn.addEventListener("click", playVoice);
  noteBtn.addEventListener("click", loveNote);

  themesBtn.addEventListener("click", openThemeSheet);
  sheetOverlay.addEventListener("click", closeThemeSheet);
  closeSheetBtn.addEventListener("click", closeThemeSheet);

  document.querySelectorAll(".sheetBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = Number(btn.dataset.theme);
      applyTheme(idx);
      closeThemeSheet();
    });
  });
})();
</script>

</body>
</html>
